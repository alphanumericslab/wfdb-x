[package]
name = "wfdbx"
version = "1.1.0"
edition = "2021"
rust-version = "1.70"
description = "The WFDB Software Package (library and command-line tools) in Rust, part of WFDB-x: the same package in seven languages"
license = "GPL-3.0-or-later"
readme = "README.md"
homepage = "https://github.com/alphanumericslab/wfdb-x"
repository = "https://github.com/alphanumericslab/wfdb-x"
documentation = "https://github.com/alphanumericslab/wfdb-x/tree/main/rust#readme"
keywords = ["wfdb", "physionet", "ecg", "physiological-signals", "biosignals"]
categories = ["science", "parser-implementations", "command-line-utilities"]
autobins = true

[lib]
name = "wfdbx"
path = "src/lib.rs"

[dependencies]
# None: the crate uses only the Rust standard library.

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "unwind"
debug = false

[profile.test]
opt-level = 1
