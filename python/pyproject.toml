[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wfdb-x"
dynamic = ["version"]
description = "A reimplementation of the WFDB Software Package (library and command-line tools) in Python, part of WFDB-x: the same package in seven languages, tested to give byte-for-byte identical results"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "Reza Sameni", email = "reza.sameni@gmail.com"}]
maintainers = [{name = "Reza Sameni", email = "reza.sameni@gmail.com"}]
keywords = ["WFDB", "PhysioNet", "physiologic signals", "ECG", "biomedical signal processing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Intended Audience :: Science/Research",
    "Framework :: Jupyter",
]
dependencies = ["numpy>=1.17"]

[project.optional-dependencies]
test = ["pytest", "nbformat", "nbclient", "ipykernel"]
examples = ["matplotlib", "jupyter"]

[project.urls]
Homepage = "https://github.com/alphanumericslab/wfdb-x"
Source = "https://github.com/alphanumericslab/wfdb-x"
Documentation = "https://github.com/alphanumericslab/wfdb-x/tree/main/python#readme"
Issues = "https://github.com/alphanumericslab/wfdb-x/issues"
Benchmarks = "https://github.com/alphanumericslab/wfdb-x/blob/main/docs/BENCHMARKS.md"

[project.scripts]
wfdbx = "wfdbx.cli:main"

[tool.setuptools.dynamic]
version = {attr = "wfdbx.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wfdbx = ["sample_data/*", "examples/*.ipynb"]
